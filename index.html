<meta charset="utf-8">
<title>Berea</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Gentium+Plus:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/reader.css">
<link rel="stylesheet" href="css/panel.css">
<script>/* apply saved theme before first paint */
try{ const t = JSON.parse(localStorage.getItem('verbum-prefs') || '{}').theme; if(t) document.documentElement.setAttribute('data-theme', t); }catch(e){}
</script>

<div id="app">
  <nav id="nav">
    <div class="nav-head">
      <div class="brand">Berea</div>
      <button id="themeBtn" title="Toggle theme">&#9788;</button>
    </div>
    <div id="bookList"></div>
    <div class="nav-foot" id="navFoot">Loading library…</div>
  </nav>

  <div id="main">
    <div id="topbar">
      <button id="navToggle" aria-label="Books">&#9776;</button>
      <div class="chapter-title" id="chapterTitle">&nbsp;</div>
      <label id="interlinearToggle"><input type="checkbox" id="interlinearCheck"> Greek line</label>
      <select id="translationSelect"></select>
      <div id="chapterNav">
        <button class="step-btn" id="prevCh" title="Previous chapter">&#8592;</button>
        <select id="chapterSelect"></select>
        <button class="step-btn" id="nextCh" title="Next chapter">&#8594;</button>
      </div>
    </div>
    <div id="reading"><div id="readingInner"><div class="loading">Loading the library&hellip;</div></div></div>
  </div>
</div>

<div id="overlay"></div>
<aside id="panel">
  <div class="panel-head">
    <div class="panel-head-row">
      <div class="panel-ref" id="panelRef">&nbsp;</div>
      <button id="panelClose" aria-label="Close">&#10005;</button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-pane="compare">Compare</button>
      <button class="tab-btn" data-pane="greek">Greek</button>
      <button class="tab-btn" data-pane="fathers">Commentary <span class="badge" id="fathersBadge">0</span></button>
    </div>
  </div>
  <div class="panel-body">
    <div class="panel-pane active" id="pane-compare"></div>
    <div class="panel-pane" id="pane-greek"></div>
    <div class="panel-pane" id="pane-fathers"></div>
  </div>
</aside>

<div id="lexBackdrop"></div>
<div id="lexPop"></div>
<script type="module" src="js/main.js"></script>
