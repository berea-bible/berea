<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berea</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Spectral:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Gentium+Plus:ital@0;1&family=Inter:wght@400;500;600;700&family=Noto+Serif+Hebrew:wght@400;500&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/reader.css">
<link rel="stylesheet" href="css/panel.css">
<script>/* apply saved theme before first paint */
try{ const t = JSON.parse(localStorage.getItem('verbum-prefs') || '{}').theme; if(t) document.documentElement.setAttribute('data-theme', t); }catch(e){}
</script>

<div id="app">
  <div id="main">
    <div id="topbar">
      <a class="brand" href="https://berea-bible.github.io/" aria-label="Berea home page">
        <span class="face latin" aria-hidden="true"><span style="--i:0">B</span><span class="sc" style="--i:1">e</span><span class="sc" style="--i:2">r</span><span class="sc" style="--i:3">e</span><span class="sc" style="--i:4">a</span></span>
        <span class="face greek" lang="el" aria-hidden="true"><span style="--i:0">Β</span><span style="--i:1">έ</span><span style="--i:2">ρ</span><span style="--i:3">ο</span><span style="--i:4">ι</span><span style="--i:5">α</span></span>
      </a>
      <div id="chapterNav">
        <button class="step-btn" id="prevCh" title="Previous chapter">&#8592;</button>
        <div class="picker-wrap">
          <button class="picker-btn book" id="bookBtn" aria-haspopup="true" aria-expanded="false"><span id="bookLabel">&nbsp;</span><span class="caret">&#9662;</span></button>
          <div class="picker" id="bookPicker" role="dialog" aria-label="Choose a book">
            <div class="picker-head"><span>Books</span><button class="picker-close" aria-label="Close">&#10005;</button></div>
            <div class="picker-body book-grid" id="bookList"></div>
            <div class="picker-foot" id="navFoot">Loading library…</div>
          </div>
        </div>
        <div class="picker-wrap">
          <button class="picker-btn" id="chapterBtn" aria-haspopup="true" aria-expanded="false"><span id="chapterLabel">&nbsp;</span><span class="caret">&#9662;</span></button>
          <div class="picker" id="chapterPicker" role="dialog" aria-label="Choose a chapter">
            <div class="picker-head"><span id="chapterPickerTitle">Chapters</span><button class="picker-close" aria-label="Close">&#10005;</button></div>
            <div class="picker-body chapter-grid" id="chapterList"></div>
          </div>
        </div>
        <button class="step-btn" id="nextCh" title="Next chapter">&#8594;</button>
      </div>
      <div id="readOpts">
        <label id="interlinearToggle" title="Show Greek line"><input type="checkbox" id="interlinearCheck"> <span class="full">Greek</span><span class="short greek">&Omega;</span></label>
        <select id="translationSelect"></select>
      </div>
      <div class="picker-wrap settings-wrap">
        <button id="menuBtn" aria-label="Settings" title="Settings" aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <div class="picker settings" id="settingsMenu" role="dialog" aria-label="Settings">
          <div class="picker-head"><span>Settings</span><button class="picker-close" aria-label="Close">&#10005;</button></div>
          <div class="settings-body">
            <div class="setting">
              <label class="setting-label" for="defaultTranslation">Default translation</label>
              <select id="defaultTranslation"></select>
              <p class="setting-hint">Berea opens in this translation. The menu in the top bar switches for this visit only.</p>
            </div>
            <div class="setting">
              <div class="setting-label" id="themeLabel">Appearance</div>
              <div class="seg" id="themeSwitch" role="group" aria-labelledby="themeLabel">
                <button data-theme-choice="">System</button><button data-theme-choice="light">Light</button><button data-theme-choice="dark">Dark</button>
              </div>
            </div>
            <div class="setting">
              <div class="setting-label" id="canonLabel">Tradition</div>
              <div class="seg" id="canonSwitch" role="group" aria-labelledby="canonLabel">
                <button data-canon="protestant">Protestant</button><button data-canon="catholic">Catholic</button><button data-canon="orthodox">Orthodox</button>
              </div>
              <p class="setting-hint" id="canonHint"></p>
            </div>
          </div>
          <div class="picker-foot"><a href="copyright.html">Copyright and sources</a> &middot; Settings are saved in this browser.</div>
        </div>
      </div>
    </div>
    <div id="reading"><div id="readingInner"><div class="loading">Loading the library&hellip;</div></div></div>
  </div>
</div>

<div id="pickerBackdrop"></div>
<div id="overlay"></div>
<aside id="panel">
  <div class="panel-head">
    <div class="panel-head-row">
      <div class="panel-ref" id="panelRef">&nbsp;</div>
      <button id="panelClose" aria-label="Close">&#10005;</button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-pane="compare">Compare</button>
      <button class="tab-btn" data-pane="greek" id="greekTab">Greek</button>
      <button class="tab-btn" data-pane="fathers">Commentary <span class="badge" id="fathersBadge">0</span></button>
    </div>
  </div>
  <div class="panel-body">
    <div class="panel-pane active" id="pane-compare"></div>
    <div class="panel-pane" id="pane-greek"></div>
    <div class="panel-pane" id="pane-fathers"></div>
  </div>
</aside>

<div id="lexBackdrop"></div>
<div id="lexPop"></div>
<script type="module" src="js/main.js"></script>
