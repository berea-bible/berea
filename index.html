<meta charset="utf-8">
<title>Berea</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Gentium+Plus:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FAF7F0; --surface:#FFFFFF; --surface-2:#F1ECDD; --surface-3:#E9E2CC;
  --ink:#26241E; --ink-dim:#726B58; --ink-faint:#A39A80;
  --border:#E1D8C0; --border-strong:#CFC2A0;
  --accent:#1E4D6B; --accent-ink:#FFFFFF; --accent-soft:#DCE9EF;
  --gold:#8C6D22; --gold-soft:#F1E6C6;
  --greek:#7A3040; --greek-soft:#F3E1E3;
  --shadow: 0 8px 30px -10px rgba(38,36,30,.25);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171A; --surface:#1C2124; --surface-2:#242A2D; --surface-3:#2C3336;
    --ink:#EAE5D7; --ink-dim:#A39C8B; --ink-faint:#726C5E;
    --border:#333A3D; --border-strong:#454D50;
    --accent:#7FB4D6; --accent-ink:#0E1518; --accent-soft:#213640;
    --gold:#D8B96A; --gold-soft:#3A311C;
    --greek:#DD98A5; --greek-soft:#3A252A;
    --shadow: 0 8px 30px -10px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#14171A; --surface:#1C2124; --surface-2:#242A2D; --surface-3:#2C3336;
  --ink:#EAE5D7; --ink-dim:#A39C8B; --ink-faint:#726C5E;
  --border:#333A3D; --border-strong:#454D50;
  --accent:#7FB4D6; --accent-ink:#0E1518; --accent-soft:#213640;
  --gold:#D8B96A; --gold-soft:#3A311C;
  --greek:#DD98A5; --greek-soft:#3A252A;
  --shadow: 0 8px 30px -10px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.greek{ font-family:'Gentium Plus','Source Serif 4',serif; }
h1,h2,h3,.display{ font-family:'Spectral',serif; }
button{ font-family:inherit; }
a{ color:var(--accent); }

/* ---------- App shell ---------- */
#app{ display:flex; height:100vh; height:100dvh; overflow:hidden; }

/* Nav rail */
#nav{
  width:272px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
  transition:transform .25s ease;
}
#nav .nav-head{
  padding:18px 18px 14px; border-bottom:1px solid var(--border);
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
}
#nav .brand{ font-family:'Spectral',serif; font-weight:700; font-size:1.3rem; letter-spacing:.01em; }
#nav .brand em{ font-style:italic; color:var(--accent); }
#themeBtn{
  background:none; border:1px solid var(--border); color:var(--ink-dim); border-radius:7px;
  width:30px; height:30px; cursor:pointer; font-size:.85rem; flex:none;
}
#themeBtn:hover{ background:var(--surface-2); }
#bookList{ flex:1; overflow-y:auto; padding:8px; }
.book-btn{
  display:flex; align-items:center; justify-content:space-between; gap:6px;
  width:100%; text-align:left; padding:8px 10px; border-radius:7px; border:none;
  background:none; color:var(--ink); font-size:.92rem; cursor:pointer; margin-bottom:1px;
}
.book-btn:hover{ background:var(--surface-2); }
.book-btn.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
.book-btn .fcount{ font-size:.68rem; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
.book-btn.active .fcount{ color:var(--accent); opacity:.75; }
#nav .nav-foot{ padding:10px 16px; border-top:1px solid var(--border); font-size:.72rem; color:var(--ink-faint); line-height:1.5; }

/* Center reading column */
#main{ flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; }
#topbar{
  display:flex; align-items:center; gap:10px; padding:12px 20px;
  border-bottom:1px solid var(--border); background:var(--surface); flex-wrap:wrap;
}
#navToggle{
  display:none; background:none; border:1px solid var(--border); border-radius:7px;
  width:34px; height:34px; color:var(--ink); cursor:pointer; font-size:1rem; flex:none;
}
.chapter-title{ font-family:'Spectral',serif; font-weight:600; font-size:1.15rem; margin-right:auto; white-space:nowrap; }
.chapter-title .num{ color:var(--accent); }
#chapterNav{ display:flex; align-items:center; gap:4px; }
.step-btn{
  background:none; border:1px solid var(--border); border-radius:7px; width:30px; height:30px;
  color:var(--ink); cursor:pointer; font-size:.9rem;
}
.step-btn:hover:not(:disabled){ background:var(--surface-2); }
.step-btn:disabled{ opacity:.3; cursor:default; }
#chapterSelect, #translationSelect{
  font-family:'Inter',sans-serif; font-size:.82rem; border:1px solid var(--border); border-radius:7px;
  background:var(--surface); color:var(--ink); padding:6px 8px; cursor:pointer;
}
#interlinearToggle{
  display:flex; align-items:center; gap:6px; font-size:.78rem; color:var(--ink-dim);
  border:1px solid var(--border); border-radius:20px; padding:5px 10px 5px 8px; cursor:pointer; background:var(--surface);
  user-select:none;
}
#interlinearToggle input{ accent-color:var(--accent); }

#reading{ flex:1; overflow-y:auto; }
#readingInner{ max-width:700px; margin:0 auto; padding:34px 26px 90px; }
.chapter-heading{ font-family:'Spectral',serif; font-size:1.7rem; font-weight:700; margin:0 0 4px; }
.chapter-sub{ color:var(--ink-dim); font-size:.85rem; margin:0 0 28px; }

.verse{ display:flex; gap:12px; margin-bottom:2px; padding:5px 10px 5px 0; border-radius:9px; scroll-margin-top:20px; }
.verse:hover{ background:var(--surface-2); }
.verse.selected{ background:var(--accent-soft); }
.vnum{
  flex:none; width:30px; text-align:right; font-variant-numeric:tabular-nums;
  color:var(--ink-faint); font-size:.78rem; padding-top:.32em; cursor:pointer; border:none; background:none;
  font-family:'Inter',sans-serif;
}
.verse:hover .vnum, .verse.selected .vnum{ color:var(--accent); font-weight:600; }
.vbody{ flex:1; min-width:0; }
.vtext{
  font-family:'Source Serif 4',serif; font-size:1.14rem; line-height:1.75; cursor:pointer; color:var(--ink);
}
.vtext .fmark{
  display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--gold);
  margin-left:5px; vertical-align:middle; opacity:.8;
}
.vgreek{
  margin-top:6px; display:flex; flex-wrap:wrap; gap:2px 3px; padding:8px 10px; background:var(--surface-2);
  border-radius:8px; border:1px solid var(--border);
}
.gword{
  display:flex; flex-direction:column; align-items:center; padding:3px 6px; border-radius:6px;
  cursor:pointer; border:none; background:none; min-width:0;
}
.gword:hover{ background:var(--greek-soft); }
.gword .gk{ font-family:'Gentium Plus',serif; font-size:1.05rem; color:var(--greek); white-space:nowrap; }
.gword .gl{ font-size:.62rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; }

.loading{ padding:60px 0; text-align:center; color:var(--ink-faint); font-size:.9rem; }

/* Detail panel */
#overlay{
  position:fixed; inset:0; background:rgba(20,18,14,.35); opacity:0; pointer-events:none;
  transition:opacity .2s ease; z-index:20;
}
#overlay.show{ opacity:1; pointer-events:auto; }
#panel{
  position:fixed; top:0; right:0; bottom:0; width:440px; max-width:92vw; background:var(--surface);
  border-left:1px solid var(--border); box-shadow:var(--shadow); transform:translateX(100%);
  transition:transform .25s ease; z-index:21; display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
#panel.show{ transform:translateX(0); }
.panel-head{ padding:16px 18px 0; flex:none; }
.panel-head-row{ display:flex; align-items:center; justify-content:space-between; }
.panel-ref{ font-family:'Spectral',serif; font-weight:700; font-size:1.25rem; }
#panelClose{
  background:none; border:1px solid var(--border); border-radius:7px; width:30px; height:30px;
  color:var(--ink-dim); cursor:pointer; font-size:1rem;
}
#panelClose:hover{ background:var(--surface-2); }
.tabs{ display:flex; gap:2px; margin:14px 0 0; border-bottom:1px solid var(--border); }
.tab-btn{
  background:none; border:none; padding:9px 12px; font-size:.82rem; color:var(--ink-dim); cursor:pointer;
  border-bottom:2px solid transparent; font-weight:500; display:flex; align-items:center; gap:5px;
}
.tab-btn.active{ color:var(--accent); border-bottom-color:var(--accent); }
.tab-btn .badge{
  background:var(--surface-3); color:var(--ink-dim); font-size:.66rem; border-radius:9px; padding:1px 6px;
  font-variant-numeric:tabular-nums;
}
.tab-btn.active .badge{ background:var(--accent-soft); color:var(--accent); }
.panel-body{ flex:1; overflow-y:auto; padding:16px 18px 40px; }
.panel-pane{ display:none; }
.panel-pane.active{ display:block; }

.cmp-item{ padding:13px 0; border-bottom:1px solid var(--border); }
.cmp-item:last-child{ border-bottom:none; }
.cmp-label{ display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
.cmp-code{ font-size:.72rem; font-weight:700; letter-spacing:.04em; color:var(--accent); }
.cmp-name{ font-size:.68rem; color:var(--ink-faint); }
.cmp-text{ font-family:'Source Serif 4',serif; font-size:.98rem; line-height:1.65; }
.cmp-item.primary .cmp-code{ color:var(--gold); }
.cmp-item.primary{ background:var(--gold-soft); margin:0 -18px; padding:13px 18px; border-bottom-color:transparent; }
.cmp-item.live .cmp-code{ color:#5B8A3A; }
.cmp-live-tag{ font-size:.62rem; background:var(--accent-soft); color:var(--accent); border-radius:10px; padding:1px 7px; font-weight:700; letter-spacing:.02em; }

.interlinear-note{ font-size:.76rem; color:var(--ink-faint); margin:0 0 14px; line-height:1.5; }
.iword{
  display:flex; align-items:baseline; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);
  cursor:pointer; text-align:left; width:100%; background:none; border-left:none; border-right:none; border-top:none;
}
.iword:hover{ background:var(--surface-2); margin:0 -18px; padding-left:18px; padding-right:18px; width:calc(100% + 36px); }
.iword .igk{ font-family:'Gentium Plus',serif; font-size:1.2rem; color:var(--greek); flex:none; min-width:74px; }
.iword .imeta{ flex:1; min-width:0; }
.iword .igloss{ font-size:.85rem; color:var(--ink); }
.iword .imorph{ font-size:.68rem; color:var(--ink-faint); margin-top:1px; }

.father-item{ padding:14px 0; border-bottom:1px solid var(--border); }
.father-item:last-child{ border-bottom:none; }
.father-name{ font-family:'Spectral',serif; font-weight:600; font-size:.98rem; color:var(--ink); }
.father-source{ font-size:.74rem; color:var(--ink-faint); font-style:italic; margin:1px 0 7px; }
.father-quote{ font-family:'Source Serif 4',serif; font-size:.94rem; line-height:1.6; color:var(--ink); }
.father-quote::before{ content:"\201C"; color:var(--gold); }
.father-quote::after{ content:"\201D"; color:var(--gold); }
.father-link{ display:inline-block; font-size:.74rem; margin-top:6px; color:var(--accent); text-decoration:none; }
.father-link:hover{ text-decoration:underline; }
.empty-state{ color:var(--ink-faint); font-size:.86rem; padding:30px 4px; text-align:center; line-height:1.6; }

/* Lexicon popover */
#lexPop{
  position:fixed; width:300px; max-width:88vw; background:var(--surface); border:1px solid var(--border-strong);
  border-radius:12px; box-shadow:var(--shadow); z-index:30; padding:16px; display:none;
  max-height:70vh; overflow-y:auto;
}
#lexPop.show{ display:block; }
.lex-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.lex-greek{ font-family:'Gentium Plus',serif; font-size:1.5rem; color:var(--greek); }
.lex-close{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:1rem; padding:2px; flex:none; }
.lex-translit{ font-size:.78rem; color:var(--ink-faint); font-style:italic; margin-top:1px; }
.lex-strongs{ font-size:.68rem; color:var(--ink-faint); margin-top:2px; letter-spacing:.02em; }
.lex-pos{
  display:inline-block; margin-top:8px; font-size:.68rem; background:var(--accent-soft); color:var(--accent);
  padding:2px 8px; border-radius:20px; font-weight:600;
}
.lex-gloss{ font-family:'Source Serif 4',serif; font-size:1.02rem; margin-top:9px; color:var(--ink); font-weight:600; }
.lex-def{ font-size:.85rem; line-height:1.6; color:var(--ink-dim); margin-top:8px; white-space:pre-line; }
#lexBackdrop{ position:fixed; inset:0; z-index:29; display:none; }
#lexBackdrop.show{ display:block; }

/* Mobile */
@media (max-width:860px){
  #nav{ position:fixed; top:0; bottom:0; left:0; z-index:25; transform:translateX(-100%); }
  #nav.show{ transform:translateX(0); box-shadow:var(--shadow); }
  #navToggle{ display:inline-block; }
  .chapter-title{ font-size:1rem; }
  #readingInner{ padding:22px 16px 90px; }
  #panel{ width:100%; max-width:100%; }
}
@media (max-width:520px){
  #translationSelect{ order:5; width:100%; }
  #interlinearToggle{ order:4; }
}

<script>
(function(){
"use strict";

/* ---------- persisted per-viewer prefs ---------- */
function loadPrefs(){
  try{
    const raw = localStorage.getItem('verbum-prefs');
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function savePrefs(){
  try{
    localStorage.setItem('verbum-prefs', JSON.stringify({
      bookId: state.bookId, chapter: state.chapter, translation: state.translation,
      showGreek: state.showGreek, theme: document.documentElement.getAttribute('data-theme') || ''
    }));
  }catch(e){}
}
const prefs = loadPrefs();
if(prefs.theme){ document.documentElement.setAttribute('data-theme', prefs.theme); }

/* ---------- morphology decoder ---------- */
const MORPH_CASE = {N:'Nominative',G:'Genitive',D:'Dative',A:'Accusative',V:'Vocative'};
const MORPH_NUM  = {S:'Singular',P:'Plural'};
const MORPH_GEN  = {M:'Masculine',F:'Feminine',N:'Neuter'};
const MORPH_TENSE= {P:'Present',I:'Imperfect',F:'Future',A:'Aorist',R:'Perfect',L:'Pluperfect',X:''};
const MORPH_VOICE= {A:'Active',M:'Middle',P:'Passive',E:'Mid/Pass',D:'Middle Deponent',O:'Passive Deponent',N:'Mid/Pass Deponent'};
const MORPH_MOOD = {I:'Indicative',S:'Subjunctive',O:'Optative',M:'Imperative',N:'Infinitive',P:'Participle'};
const POS_NAMES = {
  N:'Noun', V:'Verb', A:'Adjective', T:'Article', CONJ:'Conjunction', P:'Personal Pronoun',
  PREP:'Preposition', PRT:'Particle', ADV:'Adverb', D:'Demonstrative Pronoun', R:'Relative Pronoun',
  COND:'Conditional Particle', I:'Interrogative Pronoun', X:'Indefinite Pronoun', INJ:'Interjection',
  F:'Reflexive Pronoun', S:'Possessive Pronoun', Q:'Correlative Pronoun', C:'Numeral', K:'Particle'
};
function decodeMorph(m){
  if(!m) return '';
  const compound = m.indexOf(' +') !== -1;
  const main = m.split(' +')[0];
  const segs = main.split('-');
  const pos = segs[0];
  const posName = POS_NAMES[pos] || pos;
  const rest = segs.slice(1);
  let bits = [];
  if(pos === 'V' && rest.length){
    const tam = rest[0] || '';
    const t = MORPH_TENSE[tam[0]], v = MORPH_VOICE[tam[1]], md = MORPH_MOOD[tam[2]];
    [t,v,md].forEach(x=>{ if(x) bits.push(x); });
    const pn = rest[1] || '';
    if(/^[123]/.test(pn)){
      const p = pn[0]; const ord = p==='1'?'1st':p==='2'?'2nd':'3rd';
      const num = MORPH_NUM[pn[1]];
      bits.push(ord + ' Person' + (num? ', '+num : ''));
    } else if(pn){
      const c = MORPH_CASE[pn[0]], n = MORPH_NUM[pn[1]], g = MORPH_GEN[pn[2]];
      [c,n,g].forEach(x=>{ if(x) bits.push(x); });
    }
  } else if(rest.length){
    const cgn = rest[0];
    const c = MORPH_CASE[cgn[0]], n = MORPH_NUM[cgn[1]], g = MORPH_GEN[cgn[2]];
    [c,n,g].forEach(x=>{ if(x) bits.push(x); });
    if(rest[1] === 'P') bits.push('Proper Noun');
  }
  let out = posName + (bits.length ? ' · ' + bits.join(', ') : '');
  if(compound) out += ' (compound)';
  return out;
}

/* ---------- state & data ---------- */
const state = { bookId: prefs.bookId || 'john', chapter: prefs.chapter || 1, translation: prefs.translation || 'KJV', selectedVerse: null, showGreek: !!prefs.showGreek };
let INDEX = null;
const bookCache = {};
let lexicon = null, lexiconPromise = null;

/* ---------- NASB (live, via a Cloudflare Worker proxy in front of api.bible) ----------
   The proxy holds the api.bible key server-side, so nothing secret ever reaches
   this file or this browser. Fill these in once the Worker is deployed —
   see cloudflare-worker/ and the README for setup. Leaving proxyUrl empty simply
   hides the NASB option, so the rest of the app works fine without it. */
const NASB_CONFIG = {
  proxyUrl: 'https://berea.tommymcmichen-0ac.workers.dev/',
  bibleId: 'b8ee27bcd1cae43a-01'
};
function nasbAvailable(){ return !!(NASB_CONFIG.proxyUrl && NASB_CONFIG.bibleId); }

const USFM_ID = {
  matt:'MAT', mark:'MRK', luke:'LUK', john:'JHN', acts:'ACT', rom:'ROM',
  '1cor':'1CO', '2cor':'2CO', gal:'GAL', eph:'EPH', phil:'PHP', col:'COL',
  '1thess':'1TH', '2thess':'2TH', '1tim':'1TI', '2tim':'2TI', titus:'TIT',
  phlm:'PHM', heb:'HEB', jas:'JAS', '1pet':'1PE', '2pet':'2PE',
  '1jn':'1JN', '2jn':'2JN', '3jn':'3JN', jude:'JUD', rev:'REV'
};
function translationCodes(){
  const codes = Object.keys(INDEX.translations);
  if(nasbAvailable()) codes.push('NASB');
  return codes;
}
function translationName(code){
  return code === 'NASB' ? 'New American Standard Bible (1995, live)' : INDEX.translations[code];
}

const nasbChapterCache = {}; // "bookId.chapter" -> Promise<{verse:text}>
async function ensureNasbChapter(bookId, chapter){
  if(!nasbAvailable()) throw new Error('NASB proxy not configured');
  const key = bookId + '.' + chapter;
  if(nasbChapterCache[key]) return nasbChapterCache[key];
  const promise = (async ()=>{
    const meta = bookMeta(bookId);
    const count = (meta.verseCounts && meta.verseCounts[String(chapter)]) || 0;
    const usfm = USFM_ID[bookId];
    const verses = {};
    const nums = []; for(let v=1; v<=count; v++) nums.push(v);
    const batchSize = 8;
    for(let i=0; i<nums.length; i+=batchSize){
      const batch = nums.slice(i, i+batchSize);
      await Promise.all(batch.map(async v=>{
        const vid = usfm + '.' + chapter + '.' + v;
        const url = NASB_CONFIG.proxyUrl.replace(/\/$/,'') + '/v1/bibles/' + encodeURIComponent(NASB_CONFIG.bibleId) +
          '/verses/' + encodeURIComponent(vid) +
          '?content-type=text&include-verse-numbers=false&include-notes=false&include-titles=false&include-chapter-numbers=false';
        const res = await fetch(url);
        if(!res.ok) throw new Error('NASB request failed (' + res.status + ')');
        const data = await res.json();
        let text = (data && data.data && data.data.content) || '';
        text = text.replace(/\s+/g, ' ').trim();
        if(text) verses[String(v)] = text;
      }));
    }
    const book = bookCache[bookId];
    if(book){
      book.translations.NASB = book.translations.NASB || {};
      book.translations.NASB[String(chapter)] = verses;
    }
    return verses;
  })();
  nasbChapterCache[key] = promise;
  promise.catch(()=>{ delete nasbChapterCache[key]; }); // allow retry after failure
  return promise;
}

async function fetchJSON(path){
  const res = await fetch(path);
  if(!res.ok) throw new Error('Failed to load '+path);
  return res.json();
}
function loadBook(id){
  if(bookCache[id]) return Promise.resolve(bookCache[id]);
  return fetchJSON('data/'+id+'.json').then(d=>{ bookCache[id]=d; return d; });
}
function loadLexicon(){
  if(lexicon) return Promise.resolve(lexicon);
  if(!lexiconPromise) lexiconPromise = fetchJSON('data/lexicon.json').then(d=>{ lexicon=d; return d; });
  return lexiconPromise;
}

/* ---------- elements ---------- */
const el = {
  nav: document.getElementById('nav'),
  bookList: document.getElementById('bookList'),
  navFoot: document.getElementById('navFoot'),
  navToggle: document.getElementById('navToggle'),
  chapterTitle: document.getElementById('chapterTitle'),
  chapterSelect: document.getElementById('chapterSelect'),
  translationSelect: document.getElementById('translationSelect'),
  prevCh: document.getElementById('prevCh'),
  nextCh: document.getElementById('nextCh'),
  reading: document.getElementById('reading'),
  readingInner: document.getElementById('readingInner'),
  interlinearCheck: document.getElementById('interlinearCheck'),
  overlay: document.getElementById('overlay'),
  panel: document.getElementById('panel'),
  panelRef: document.getElementById('panelRef'),
  panelClose: document.getElementById('panelClose'),
  fathersBadge: document.getElementById('fathersBadge'),
  paneCompare: document.getElementById('pane-compare'),
  paneGreek: document.getElementById('pane-greek'),
  paneFathers: document.getElementById('pane-fathers'),
  lexPop: document.getElementById('lexPop'),
  lexBackdrop: document.getElementById('lexBackdrop'),
  themeBtn: document.getElementById('themeBtn'),
};
el.interlinearCheck.checked = state.showGreek;

/* ---------- nav ---------- */
function renderNav(){
  el.bookList.innerHTML = '';
  INDEX.books.forEach(b=>{
    const btn = document.createElement('button');
    btn.className = 'book-btn' + (b.id === state.bookId ? ' active' : '');
    btn.dataset.id = b.id;
    btn.innerHTML = '<span>'+b.name+'</span>' + (b.fatherVerseCount ? '<span class="fcount">'+b.fatherVerseCount+'</span>' : '');
    btn.addEventListener('click', ()=> selectBook(b.id, 1));
    el.bookList.appendChild(btn);
  });
  el.navFoot.textContent = INDEX.fatherAuthorCount + ' early patristic authors · ' + INDEX.fatherQuoteCount.toLocaleString() + ' citations, c. 100–800 AD';
  renderTranslationSelect();
}
function renderTranslationSelect(){
  const prev = el.translationSelect.value;
  el.translationSelect.innerHTML = '';
  Object.keys(INDEX.translations).forEach(code=>{
    const opt = document.createElement('option');
    opt.value = code; opt.textContent = code + ' — ' + INDEX.translations[code];
    el.translationSelect.appendChild(opt);
  });
  if(nasbAvailable()){
    const nasbOpt = document.createElement('option');
    nasbOpt.value = 'NASB';
    nasbOpt.textContent = 'NASB — New American Standard (1995, live)';
    el.translationSelect.appendChild(nasbOpt);
  }
  el.translationSelect.value = (prev && [...el.translationSelect.options].some(o=>o.value===prev)) ? prev : state.translation;
}
function markActiveBook(){
  [...el.bookList.children].forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.id === state.bookId);
  });
}
function bookMeta(id){ return INDEX.books.find(b=>b.id===id); }

function populateChapterSelect(){
  const meta = bookMeta(state.bookId);
  el.chapterSelect.innerHTML = '';
  for(let c=1; c<=meta.chapters; c++){
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = 'Chapter ' + c;
    if(c === state.chapter) opt.selected = true;
    el.chapterSelect.appendChild(opt);
  }
  el.prevCh.disabled = state.chapter <= 1;
  el.nextCh.disabled = state.chapter >= meta.chapters;
}

/* ---------- reading pane ---------- */
async function selectBook(id, chapter){
  state.bookId = id; state.chapter = chapter || 1; state.selectedVerse = null;
  closeNavMobile(); closePanel();
  markActiveBook();
  el.readingInner.innerHTML = '<div class="loading">Loading '+bookMeta(id).name+'&hellip;</div>';
  await loadBook(id);
  populateChapterSelect();
  await showChapter();
  savePrefs();
}
async function selectChapter(c){
  state.chapter = c; state.selectedVerse = null;
  closePanel();
  await loadBook(state.bookId);
  populateChapterSelect();
  await showChapter();
  savePrefs();
}
async function showChapter(){
  if(state.translation === 'NASB' && !nasbAvailable()){
    state.translation = 'KJV';
    el.translationSelect.value = 'KJV';
  }
  if(state.translation === 'NASB'){
    el.chapterTitle.innerHTML = bookMeta(state.bookId).name + ' <span class="num">' + state.chapter + '</span>';
    el.readingInner.innerHTML = '<div class="loading">Fetching NASB&hellip;</div>';
    try{
      await ensureNasbChapter(state.bookId, state.chapter);
    }catch(e){
      el.readingInner.innerHTML =
        '<div class="loading" style="max-width:440px;margin:60px auto 0;line-height:1.6">'+
        'Couldn\'t load the NASB (' + escapeHtml(e.message||'') + ').<br><br>'+
        '<button id="nasbRetryLink" class="text-btn" style="display:inline;background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:inherit">Try again</button>'+
        ' or <button id="nasbFallbackLink" class="text-btn" style="display:inline;background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:inherit">switch to KJV</button>.'+
        '</div>';
      const retry = document.getElementById('nasbRetryLink');
      if(retry) retry.addEventListener('click', ()=> showChapter());
      const fallback = document.getElementById('nasbFallbackLink');
      if(fallback) fallback.addEventListener('click', ()=>{
        state.translation = 'KJV'; el.translationSelect.value = 'KJV'; showChapter(); savePrefs();
      });
      return;
    }
  }
  renderChapter();
}
function renderChapter(){
  const book = bookCache[state.bookId];
  const meta = bookMeta(state.bookId);
  const ch = String(state.chapter);
  const verses = (book.translations[state.translation] || {})[ch] || {};
  const verseNums = Object.keys(verses).map(Number).sort((a,b)=>a-b);
  const greekCh = book.greek[ch] || {};
  const fathersCh = book.fathers[ch] || {};

  el.chapterTitle.innerHTML = meta.name + ' <span class="num">' + state.chapter + '</span>';

  let html = '<h2 class="chapter-heading">'+meta.name+' '+state.chapter+'</h2>';
  html += '<p class="chapter-sub">'+state.translation+' &middot; tap a verse number to compare translations, read the Greek, or see the church fathers</p>';

  verseNums.forEach(vn=>{
    const vs = String(vn);
    const text = verses[vs];
    const hasFathers = fathersCh[vs] && fathersCh[vs].length;
    html += '<div class="verse" data-v="'+vs+'">';
    html += '<button class="vnum" data-v="'+vs+'">'+vs+'</button>';
    html += '<div class="vbody">';
    html += '<div class="vtext" data-v="'+vs+'">'+escapeHtml(text)+(hasFathers?'<span class="fmark" title="Church father citations available"></span>':'')+'</div>';
    if(state.showGreek && greekCh[vs]){
      html += '<div class="vgreek">' + greekCh[vs].map(w=>
        '<button class="gword" data-s="'+ (w.s[0]||'') +'">'+
          '<span class="gk">'+escapeHtml(w.g)+'</span>'+
          '<span class="gl">'+escapeHtml(w.gl)+'</span>'+
        '</button>'
      ).join('') + '</div>';
    }
    html += '</div></div>';
  });

  el.readingInner.innerHTML = html;

  el.readingInner.querySelectorAll('.vnum, .vtext').forEach(node=>{
    node.addEventListener('click', ()=> openVerse(parseInt(node.dataset.v,10)));
  });
  el.readingInner.querySelectorAll('.gword').forEach(node=>{
    node.addEventListener('click', (e)=>{ e.stopPropagation(); showLexicon(node.dataset.s, node); });
  });
  el.reading.scrollTop = 0;
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------- verse detail panel ---------- */
async function openVerse(vn){
  state.selectedVerse = vn;
  [...el.readingInner.querySelectorAll('.verse')].forEach(v=> v.classList.toggle('selected', parseInt(v.dataset.v,10)===vn));
  const meta = bookMeta(state.bookId);
  const ch = String(state.chapter), vs = String(vn);

  el.panelRef.textContent = meta.name + ' ' + state.chapter + ':' + vs;
  el.paneCompare.innerHTML = '<div class="loading" style="padding:30px 0">Loading&hellip;</div>';
  showTab('compare');
  openPanel();

  if(nasbAvailable()){
    try{ await ensureNasbChapter(state.bookId, state.chapter); }
    catch(e){ /* fall through — compare tab just omits NASB for this verse */ }
  }
  if(state.selectedVerse !== vn) return; // user moved on while we were fetching

  const book = bookCache[state.bookId];

  /* Compare tab */
  let cmp = '';
  translationCodes().forEach(code=>{
    const text = ((book.translations[code]||{})[ch]||{})[vs];
    if(!text) return;
    const isLive = code === 'NASB';
    cmp += '<div class="cmp-item'+(code===state.translation?' primary':'')+(isLive?' live':'')+'">'+
      '<div class="cmp-label"><span class="cmp-code">'+code+'</span><span class="cmp-name">'+translationName(code)+'</span>'+
      (isLive ? '<span class="cmp-live-tag">LIVE</span>' : '')+'</div>'+
      '<div class="cmp-text">'+escapeHtml(text)+'</div></div>';
  });
  el.paneCompare.innerHTML = cmp || '<div class="empty-state">No text found for this verse.</div>';

  /* Greek tab */
  const words = ((book.greek[ch]||{})[vs]) || [];
  if(words.length){
    let g = '<p class="interlinear-note">Word-by-word Greek for this verse, drawn from the critical editions (NA/SBL/TR family). Tap a word for its full lexicon entry.</p>';
    g += words.map(w=>
      '<button class="iword" data-s="'+(w.s[0]||'')+'">'+
        '<span class="igk">'+escapeHtml(w.g)+'</span>'+
        '<span class="imeta"><span class="igloss">'+escapeHtml(w.gl)+(w.t && w.t.trim() && w.t.trim()!==w.gl ? ' <span style="color:var(--ink-faint)">&mdash; "'+escapeHtml(w.t.trim())+'" here</span>':'')+'</span>'+
        '<span class="imorph">'+escapeHtml(decodeMorph(w.m))+'</span></span>'+
      '</button>'
    ).join('');
    el.paneGreek.innerHTML = g;
    el.paneGreek.querySelectorAll('.iword').forEach(node=>{
      node.addEventListener('click', ()=> showLexicon(node.dataset.s, node));
    });
  } else {
    el.paneGreek.innerHTML = '<div class="empty-state">This verse falls outside the tagged Greek New Testament data (Matthew&ndash;Revelation).</div>';
  }

  /* Fathers tab */
  const qIdxs = ((book.fathers[ch]||{})[vs]) || [];
  el.fathersBadge.textContent = qIdxs.length;
  if(qIdxs.length){
    const quotes = qIdxs.map(i => book.quotes[i]).sort((a,b)=> a.father.localeCompare(b.father));
    el.paneFathers.innerHTML = quotes.map(q=>
      '<div class="father-item">'+
        '<div class="father-name">'+escapeHtml(q.father)+'</div>'+
        '<div class="father-source">'+escapeHtml(q.source_title)+'</div>'+
        '<div class="father-quote">'+escapeHtml(q.quote)+'</div>'+
        (q.source_url ? '<a class="father-link" href="'+q.source_url+'" target="_blank" rel="noopener">Read the full source ↗</a>' : '')+
      '</div>'
    ).join('');
  } else {
    el.paneFathers.innerHTML = '<div class="empty-state">No surviving citations from this era (c. 100–800 AD) are indexed for this verse yet.</div>';
  }
}
function showTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.pane===name));
  document.querySelectorAll('.panel-pane').forEach(p=> p.classList.toggle('active', p.id==='pane-'+name));
}
document.querySelectorAll('.tab-btn').forEach(b=> b.addEventListener('click', ()=> showTab(b.dataset.pane)));

function openPanel(){ el.overlay.classList.add('show'); el.panel.classList.add('show'); }
function closePanel(){
  el.overlay.classList.remove('show'); el.panel.classList.remove('show');
  state.selectedVerse = null;
  [...el.readingInner.querySelectorAll('.verse')].forEach(v=> v.classList.remove('selected'));
}
el.panelClose.addEventListener('click', closePanel);
el.overlay.addEventListener('click', ()=>{ closePanel(); hideLexicon(); });

/* ---------- lexicon popover ---------- */
async function showLexicon(strongs, anchor){
  if(!strongs){ el.lexPop.innerHTML = '<div class="empty-state">No lexicon entry available.</div>'; }
  else {
    el.lexPop.innerHTML = '<div class="loading" style="padding:20px 0">Loading entry&hellip;</div>';
  }
  positionPopover(anchor);
  el.lexPop.classList.add('show'); el.lexBackdrop.classList.add('show');
  if(!strongs) return;
  const lex = await loadLexicon();
  const entry = lex[strongs];
  if(!entry){
    el.lexPop.innerHTML = '<div class="empty-state">No lexicon entry for '+strongs+'.</div>';
    return;
  }
  el.lexPop.innerHTML =
    '<div class="lex-head"><div><div class="lex-greek">'+escapeHtml(entry.greek)+'</div>'+
    '<div class="lex-translit">'+escapeHtml(entry.translit)+'</div>'+
    '<div class="lex-strongs">'+strongs+'</div></div>'+
    '<button class="lex-close" aria-label="Close">&#10005;</button></div>'+
    '<span class="lex-pos">'+escapeHtml(entry.pos)+'</span>'+
    '<div class="lex-gloss">'+escapeHtml(entry.gloss)+'</div>'+
    '<div class="lex-def">'+escapeHtml(entry.definition)+'</div>';
  el.lexPop.querySelector('.lex-close').addEventListener('click', hideLexicon);
  positionPopover(anchor);
}
function positionPopover(anchor){
  const r = anchor.getBoundingClientRect();
  const popW = Math.min(300, window.innerWidth*0.88);
  let left = r.left;
  let top = r.bottom + 8;
  if(left + popW > window.innerWidth - 12) left = window.innerWidth - popW - 12;
  if(left < 12) left = 12;
  const maxTop = window.innerHeight - 60;
  if(top > maxTop) top = Math.max(12, r.top - 8 - 300);
  el.lexPop.style.left = left + 'px';
  el.lexPop.style.top = Math.min(top, maxTop) + 'px';
}
function hideLexicon(){ el.lexPop.classList.remove('show'); el.lexBackdrop.classList.remove('show'); }
el.lexBackdrop.addEventListener('click', hideLexicon);
window.addEventListener('resize', ()=>{ if(el.lexPop.classList.contains('show')) hideLexicon(); });

/* ---------- top bar controls ---------- */
el.translationSelect.addEventListener('change', async ()=>{
  state.translation = el.translationSelect.value;
  await showChapter();
  if(state.selectedVerse) openVerse(state.selectedVerse);
  savePrefs();
});
el.chapterSelect.addEventListener('change', ()=> selectChapter(parseInt(el.chapterSelect.value,10)));
el.prevCh.addEventListener('click', ()=>{ if(state.chapter>1) selectChapter(state.chapter-1); });
el.nextCh.addEventListener('click', ()=>{ const m=bookMeta(state.bookId); if(state.chapter<m.chapters) selectChapter(state.chapter+1); });
el.interlinearCheck.addEventListener('change', ()=>{ state.showGreek = el.interlinearCheck.checked; renderChapter(); savePrefs(); });
el.navToggle.addEventListener('click', ()=> el.nav.classList.toggle('show'));
function closeNavMobile(){ el.nav.classList.remove('show'); }
el.themeBtn.addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark' : (sysDark ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next);
  savePrefs();
});

/* ---------- boot ---------- */
async function boot(){
  try{
    INDEX = await fetchJSON('data/books-index.json');
  }catch(e){
    el.readingInner.innerHTML = '<div class="loading">Could not load the library. Please reload.</div>';
    return;
  }
  if(!bookMeta(state.bookId)) state.bookId = 'john';
  renderNav();
  await loadBook(state.bookId);
  const meta = bookMeta(state.bookId);
  if(state.chapter > meta.chapters) state.chapter = 1;
  populateChapterSelect();
  await showChapter();
}
boot();

})();
</script>
